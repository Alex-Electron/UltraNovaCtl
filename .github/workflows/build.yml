name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build UltraNovaCtl.sln -c Release

      - name: Publish a self-contained executable
        run: >
          dotnet publish src/Gui/UltraNovaCtl.Gui.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist/UltraNovaCtl-win-x64

      - name: Add the release readme
        run: copy installer\RELEASE-README.txt dist\UltraNovaCtl-win-x64\README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UltraNovaCtl-win-x64
          path: dist/UltraNovaCtl-win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\UltraNovaCtl.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: UltraNovaCtl-setup
          path: dist/*-setup.exe
